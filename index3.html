    <h1>FCM通知テスト</h1>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-messaging-compat.js"></script>

    <script>
  const firebaseConfig = {
    apiKey: "AIzaSyBNdUCOex6fVdBBfiMXyWhJtmVFwcf_Tdo",
    authDomain: "pwa-push-test-2283d.firebaseapp.com",
    projectId: "pwa-push-test-2283d",
    storageBucket: "pwa-push-test-2283d.firebasestorage.app",
    messagingSenderId: "861182613182",
    appId: "1:861182613182:web:ba7b947993fa3c0610f0ef"
  };

        firebase.initializeApp(firebaseConfig);
        const messaging = firebase.messaging();

        // 通知の許可を得て、トークン（住所）を取得
        messaging.getToken({ vapidKey: 'BClfbibGWlmHr1ipHag-A74Zlo3upeEsYiz-IHHTMdPCASvy-ld9VQ8aOqQz1FxjH-uNeEAc-YCq1b36IK1khxE' }).then((currentToken) => {
            if (currentToken) {
                console.log('あなたのトークン（住所）はこれです：');
                console.log(currentToken);
                document.body.innerHTML += `<h2>トークン取得成功！</h2><textarea style="width:100%;height:100px;">${currentToken}</textarea>`;
            } else {
                console.log('通知の許可が必要です');
            }
        }).catch((err) => {
            console.log('エラーが発生しました', err);
        });
    </script>
</body>
