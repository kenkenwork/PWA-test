<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>FCM Test</title>
</head>
<body>
  <h1>FCM通知テスト</h1>
  <button id="btn">通知トークンを取得</button>
  <pre id="log"></pre>

  <!-- Firebase SDK（compat） -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

  <script>
  const firebaseConfig = {
    apiKey: "AIzaSyBNdUCOex6fVdBBfiMXyWhJtmVFwcf_Tdo",
    authDomain: "pwa-push-test-2283d.firebaseapp.com",
    projectId: "pwa-push-test-2283d",
    storageBucket: "pwa-push-test-2283d.firebasestorage.app",
    messagingSenderId: "861182613182",
    appId: "1:861182613182:web:ba7b947993fa3c0610f0ef"
  };

    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();

    const log = (msg) => {
      console.log(msg);
      document.getElementById("log").textContent += msg + "\n";
    };

    document.getElementById("btn").addEventListener("click", async () => {
      try {
        // ① 通知の許可（ユーザー操作必須）
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          log("❌ 通知が許可されませんでした");
          return;
        }

        // ② Service Worker 登録
        const registration = await navigator.serviceWorker.register(
          "./firebase-messaging-sw.js"
        );
        log("✅ Service Worker 登録完了");

        // ③ トークン取得
        const token = await messaging.getToken({
          vapidKey: "BClfbibGWlmHr1ipHag-A74Zlo3upeEsYiz-IHHTMdPCASvy-ld9VQ8aOqQz1FxjH-uNeEAc-YCq1b36IK1khxE",
          serviceWorkerRegistration: registration,
        });

        if (token) {
          log("🎉 トークン取得成功！");
          log(token);
        } else {
          log("⚠️ トークンが取得できませんでした");
        }
      } catch (err) {
        log("🔥 エラー発生");
        log(err.message || err);
      }
    });
  </script>
</body>
</html>
